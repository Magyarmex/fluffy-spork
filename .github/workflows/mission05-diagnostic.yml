name: Mission 05 Diagnostic
on:
  push:
    branches: [novastar/mission-05-canonical-content]

jobs:
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --no-package-lock
      - name: Capture Mission 05 parity output
        shell: bash
        run: |
          set +e
          node --test tests/node/canonical-content-mission-05.test.js > /tmp/mission05.log 2>&1
          status=$?
          {
            echo '## Mission 05 parity diagnostic'
            echo '```text'
            cat /tmp/mission05.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$status" -ne 0 ]; then
            msg=$(tail -n 80 /tmp/mission05.log | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g')
            echo "::error title=Mission 05 parity output::$msg"
          fi
          exit $status
