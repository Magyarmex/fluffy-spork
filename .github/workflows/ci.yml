name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build
      - run: npm run validate:dist
      - name: Validate production Tailwind compilation
        shell: bash
        run: |
          set -euo pipefail
          npx @tailwindcss/cli -i .github/nova-tailwind.css -o /tmp/nova-tailwind.css --minify
          test -s /tmp/nova-tailwind.css
          grep -Fq '.pointer-events-none' /tmp/nova-tailwind.css
          grep -Fq '.font-display' /tmp/nova-tailwind.css
