name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm run build
      - run: npm run test
      - name: Validate production Tailwind compilation
        shell: bash
        run: |
          set -euo pipefail
          cp index.html index.html.new
          npx @tailwindcss/cli -i .github/nova-tailwind.css -o /tmp/nova-tailwind.css --minify
          test -s /tmp/nova-tailwind.css
          grep -Fq '.pointer-events-none' /tmp/nova-tailwind.css
          grep -Fq '.font-display' /tmp/nova-tailwind.css
          rm -f index.html.new /tmp/nova-tailwind.css

  android-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile NOVA Owner companion
        run: gradle -p android-owner :app:assembleDebug --stacktrace
      - name: Publish installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NOVA-Owner-debug-apk
          path: android-owner/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
