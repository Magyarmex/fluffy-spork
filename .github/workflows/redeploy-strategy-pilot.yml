name: NOVA Redeploy Strategy Pilot

on:
  push:
    branches:
      - 'nova/redeploy-*-pilot-*'
    paths:
      - 'tests/node/redeploy-paired-real-pilot.test.js'
      - 'tests/node/redeploy-public-roam.test.js'
      - 'tests/research/redeploy-public-roam.cjs'
      - 'tests/research/redeploy-public-prelife.cjs'
      - 'tests/node/redeploy-public-prelife.test.js'
      - 'tests/node/redeploy-played-prelife-report.test.js'
      - 'scripts/redeploy-played-prelife-report.cjs'
      - 'scripts/redeploy-crossed-geography-report.cjs'
      - 'tests/node/redeploy-crossed-geography-report.test.js'
      - '.github/workflows/redeploy-strategy-pilot.yml'
  workflow_dispatch:

concurrency:
  group: redeploy-pilot-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  paired-real-engine:
    strategy:
      matrix:
        policy: [navigate, harvest, harvest_roam]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run 36 matched worlds at 30/60 Hz for 20 simulated seconds (${{ matrix.policy }})
        env:
          NOVA_REDEPLOY_FULL_PILOT: '1'
          NOVA_REDEPLOY_POLICY: ${{ matrix.policy }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/redeploy-pilot
          node --test tests/node/redeploy-paired-real-pilot.test.js 2>&1 | tee artifacts/redeploy-pilot/run.log
      - name: Preserve paired simulation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-redeploy-paired-${{ matrix.policy }}
          path: artifacts/redeploy-pilot/
          if-no-files-found: error
          retention-days: 30

  played-first-life:
    # Separate cohort: never pool with the instant-death baseline. This
    # exercises actual 8s first-life combat/ecology before either redeploy arm.
    strategy:
      fail-fast: false
      matrix:
        policy: [navigate, harvest_roam]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run 36 matched post-combat worlds at 30/60 Hz (${{ matrix.policy }})
        env:
          NOVA_REDEPLOY_FULL_PILOT: '1'
          NOVA_REDEPLOY_POLICY: ${{ matrix.policy }}
          NOVA_REDEPLOY_PRELIFE_SECONDS: '8'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/redeploy-pilot
          node --test tests/node/redeploy-paired-real-pilot.test.js 2>&1 | tee artifacts/redeploy-pilot/run.log
      - name: Analyze played-first-life cohort with seed-clustered uncertainty
        env:
          NOVA_REDEPLOY_POLICY: ${{ matrix.policy }}
        run: node scripts/redeploy-played-prelife-report.cjs "artifacts/redeploy-pilot/results-${NOVA_REDEPLOY_POLICY}.json"
      - name: Preserve post-combat paired evidence, including falsifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-redeploy-played-prelife-${{ matrix.policy }}
          path: artifacts/redeploy-pilot/
          if-no-files-found: error
          retention-days: 30

  natural-death-exposure:
    # Research only: longer actual first-life play, with forced deaths
    # explicitly censored. Two independent seeds per layout/rotation cell.
    # Do not pool these results with the 8s played-first-life cohort.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run 12 predeclared worlds at 30/60 Hz with 60s public first-life play
        env:
          NOVA_REDEPLOY_FULL_PILOT: '1'
          NOVA_REDEPLOY_NATURAL_PILOT: '1'
          NOVA_REDEPLOY_POLICY: harvest_roam
          NOVA_REDEPLOY_PRELIFE_SECONDS: '60'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/redeploy-pilot
          node --test tests/node/redeploy-paired-real-pilot.test.js 2>&1 | tee artifacts/redeploy-pilot/run.log
      - name: Count natural deaths, forced redeploys and FPS discordance
        env:
          NOVA_REDEPLOY_EXPECTED_SEEDS: '12'
        run: node scripts/redeploy-played-prelife-report.cjs artifacts/redeploy-pilot/results-harvest_roam.json
      - name: Preserve natural-death exposure and all censored trials
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-redeploy-natural-death-exposure
          path: artifacts/redeploy-pilot/
          if-no-files-found: warn
          retention-days: 30

  compare-played-policies:
    needs: played-first-life
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: nova-redeploy-played-prelife-*
          path: artifacts/played
          merge-multiple: false
      - name: Compare post-front roaming against navigation after identical first lives
        shell: bash
        run: |
          set -euo pipefail
          node scripts/redeploy-pilot-analysis.cjs \
            artifacts/played/nova-redeploy-played-prelife-navigate/results-navigate.json \
            artifacts/played/nova-redeploy-played-prelife-harvest_roam/results-harvest_roam.json \
            | tee artifacts/played/played-policy-contrast.json
      - name: Preserve seed-clustered difference-in-differences, including negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-redeploy-played-prelife-contrast
          path: artifacts/played/played-policy-contrast.json
          if-no-files-found: warn
          retention-days: 30

  crossed-geography:
    # Research-only 2x2: both actual player positions crossed with both
    # native post-redeploy AI/neutral worlds. Do not interpret as human fun.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run 12 predeclared worlds at 30/60 Hz with 8s witnessed first lives
        env:
          NOVA_REDEPLOY_CROSSED_PILOT: '1'
          NOVA_REDEPLOY_PRELIFE_SECONDS: '8'
          NOVA_REDEPLOY_POLICY: harvest_roam
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/redeploy-pilot
          node --test tests/node/redeploy-paired-real-pilot.test.js 2>&1 | tee artifacts/redeploy-pilot/crossed-run.log
      - name: Analyze within-base geography and between-base RNG effects
        run: node scripts/redeploy-crossed-geography-report.cjs artifacts/redeploy-pilot/crossed-geography.json
      - name: Preserve crossed evidence and falsifications
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-redeploy-crossed-geography
          path: artifacts/redeploy-pilot/crossed-*
          if-no-files-found: warn
          retention-days: 30
