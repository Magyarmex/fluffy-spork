name: NOVA Critical Heal Route Continuity
on:
  pull_request:
    paths:
      - 'nova-updates/terrain-intelligence-v1.10.2.js'
      - 'nova-updates/battle-sense-v1.8.1.js'
      - 'nova-updates/combined-arms-v1.7.2.js'
      - 'index.html'
      - 'tests/browser/critical-heal-route-continuity.cjs'
      - '.github/workflows/critical-heal-route-continuity.yml'
  workflow_dispatch:
jobs:
  acquisition:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm install --no-save --no-audit --no-fund --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - name: Serve exact checked-out materialized game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nova-pickup-http.log 2>&1 &
      - name: Verify composed-game critical-heal route continuity
        run: node tests/browser/critical-heal-route-continuity.cjs
