name: NOVA Browser Smoke

on:
  push:
    branches: [main]
    paths:
      - 'nova-updates/**'
      - 'index.html'
      - 'tests/browser/**'
      - '.github/workflows/browser-smoke.yml'
      - 'scripts/patch-star-minimap.cjs'
      - 'scripts/patch-saved-records.cjs'
  pull_request:
    paths:
      - 'nova-updates/**'
      - 'index.html'
      - 'tests/browser/**'
      - '.github/workflows/browser-smoke.yml'
      - 'scripts/patch-star-minimap.cjs'
      - 'scripts/patch-saved-records.cjs'
  workflow_dispatch:

# Supersede obsolete PR/feature-branch checks; never cancel a mainline
# validation or an explicit manual run. Event-scoped groups avoid push/PR
# collisions for the same head, and main uses its SHA rather than ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm install --no-save --no-audit --no-fund --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - name: Apply the exact production base-minimap patch to the PR shipping shell
        run: node scripts/patch-star-minimap.cjs index.html
      - name: Apply canonical saved-record protection before browser tests
        run: node scripts/patch-saved-records.cjs index.html
      - name: Serve shipping runtime
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nova-browser-http.log 2>&1 &
          echo $! > /tmp/nova-browser-http.pid
      - name: Run real React + Chromium smoke
        run: |
          node tests/browser/real-touch-gameplay.cjs
          node tests/browser/shipping-ui-smoke.cjs
          node tests/browser/tactical-frontlines-memory.cjs
          node tests/browser/frontlines-bloom-compass.cjs
          node tests/browser/frontlines-migration-route-memory.cjs
          node tests/browser/frontlines-migration-ai-audit.cjs
          node tests/browser/frontlines-rogue-star-compass.cjs
          node tests/browser/frontlines-tactical-turn.cjs
          node tests/browser/frontlines-paired-microtrial.cjs
          node tests/browser/frontlines-route-matrix.cjs
          node tests/browser/best-score-live-reload.cjs
          node tests/browser/corrupt-saved-records.cjs
          node tests/browser/redeploy-front-choice.cjs
          node tests/browser/fieldcraft-class-counterplay.cjs
      - name: Preserve browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-browser-smoke
          path: artifacts/browser/
          if-no-files-found: ignore
          retention-days: 14
