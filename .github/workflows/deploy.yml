name: Materialize NOVA TANKS

on:
  push:
    branches: [main]
    paths:
      - 'nova-gz/**'
      - 'nova-updates/**'
      - 'manifest.webmanifest'
      - 'nova-icon.svg'
      - 'pwa-register.js'
      - 'sw.js'
      - 'package.json'
      - '.github/nova-tailwind.css'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pinned production CSS compiler
        shell: bash
        run: npm install --no-audit --no-fund --no-package-lock

      - name: Validate runtime release files
        shell: bash
        run: |
          set -euo pipefail
          for f in nova-updates/*.js; do
            node --check "$f"
          done
          node --check pwa-register.js
          node --check sw.js
          python3 -m json.tool nova-updates/releases.json >/dev/null
          python3 -m json.tool manifest.webmanifest >/dev/null

      - name: Rebuild tested NOVA payload and apply versioned runtime updates
        shell: bash
        run: |
          set -euo pipefail
          cat nova-gz/*.b64 | tr -d '\r\n\t ' | base64 --decode | gzip --decompress > index.html.new
          test -s index.html.new
          grep -q 'NOVA TANKS' index.html.new

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html.new')
          html = path.read_text(encoding='utf-8')

          pwa_head = (
              '    <link rel="manifest" href="./manifest.webmanifest" />\n'
              '    <link rel="icon" href="./nova-icon.svg" type="image/svg+xml" />\n'
              '    <meta name="application-name" content="NOVA TANKS" />\n'
              '    <script defer src="./pwa-register.js"></script>\n'
          )
          if './manifest.webmanifest' not in html:
              if '</head>' not in html:
                  raise SystemExit('NOVA head marker not found')
              html = html.replace('</head>', pwa_head + '  </head>', 1)

          define_marker = "  window.__defineModule = function (id, factory) {"
          if 'window.__novaModules = modules;' not in html:
              if define_marker not in html:
                  raise SystemExit('NOVA module registry marker not found')
              exposed = (
                  "  window.__novaModules = modules;\n"
                  "  window.__novaCache = cache;\n"
                  "  window.__novaMakeRequire = makeRequire;\n\n"
              )
              html = html.replace(define_marker, exposed + define_marker, 1)

          scripts = [
              './nova-updates/sniper-v1.2.0.js',
              './nova-updates/controller-v1.3.0.js',
              './nova-updates/polish-v1.3.1.js',
              './nova-updates/stability-v1.4.0.js',
              './nova-updates/sniper-lineage-v1.4.1.js',
              './nova-updates/showroom-v1.5.0.js',
              './nova-updates/showroom-polish-v1.5.1.js',
              './nova-updates/drone-discipline-v1.5.1.js',
              './nova-updates/drone-targeting-v1.5.1.js',
              './nova-updates/spotter-intelligence-v1.5.1.js',
              './nova-updates/ui-fixes-v1.5.1.js',
              './nova-updates/lobby-music-v1.5.1.js',
              './nova-updates/battlefield-v1.6.0.js',
              './nova-updates/disciplines-v1.7.0.js',
              './nova-updates/apex-disciplines-v1.7.1.js',
              './nova-updates/combined-arms-v1.7.2.js',
              './nova-updates/blast-cover-hardening-v1.7.2.js',
              './nova-updates/showroom-containment-v1.7.2.js',
              './nova-updates/showroom-fit-v1.7.3.js',
              './nova-updates/auto-update-test-v1.7.4.js',
              './nova-updates/performance-v1.7.5.js',
              './nova-updates/performance-v1.7.6.js',
              './nova-updates/lobby-history.js',
          ]
          pattern = r"window\.__bootModule\((['\"])main\1\);"
          match = re.search(pattern, html)
          if not match:
              raise SystemExit('NOVA boot marker not found')
          boot = match.group(0)
          tags = ''.join(f'<script src="{s}"></script>\n' for s in scripts if s not in html)
          if tags:
              injection = '</script>\n' + tags + '<script>\n' + boot
              html = html[:match.start()] + injection + html[match.end():]

          path.write_text(html, encoding='utf-8')
          PY

          # The browser Tailwind compiler is intentionally development-only.
          # Compile the exact same v4.3.2 theme/classes once at release time,
          # then inline the result so production has zero Tailwind runtime work.
          npx @tailwindcss/cli -i .github/nova-tailwind.css -o nova-tailwind.generated.css --minify
          test -s nova-tailwind.generated.css

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html.new')
          html = path.read_text(encoding='utf-8')
          css = Path('nova-tailwind.generated.css').read_text(encoding='utf-8')

          browser = re.compile(r'\s*<script\b[^>]*src=["\'][^"\']*tailwindcss-browser[^"\']*["\'][^>]*>\s*</script>', re.I)
          html, browser_count = browser.subn('', html)
          if browser_count != 1:
              raise SystemExit(f'Expected exactly one Tailwind browser runtime, found {browser_count}')

          tw_style = re.compile(r'\s*<style\s+type=["\']text/tailwindcss["\']\s*>.*?</style>', re.I | re.S)
          match = tw_style.search(html)
          if not match:
              raise SystemExit('Tailwind theme style marker not found')
          static = '\n    <style id="nova-tailwind-static">' + css + '</style>'
          html = html[:match.start()] + static + html[match.end():]
          path.write_text(html, encoding='utf-8')
          PY
          rm -f nova-tailwind.generated.css

          grep -q '__novaModules' index.html.new
          grep -q 'manifest.webmanifest' index.html.new
          grep -q 'pwa-register.js' index.html.new
          grep -q 'nova-updates/sniper-v1.2.0.js' index.html.new
          grep -q 'nova-updates/controller-v1.3.0.js' index.html.new
          grep -q 'nova-updates/polish-v1.3.1.js' index.html.new
          grep -q 'nova-updates/stability-v1.4.0.js' index.html.new
          grep -q 'nova-updates/sniper-lineage-v1.4.1.js' index.html.new
          grep -q 'nova-updates/showroom-v1.5.0.js' index.html.new
          grep -q 'nova-updates/showroom-polish-v1.5.1.js' index.html.new
          grep -q 'nova-updates/drone-discipline-v1.5.1.js' index.html.new
          grep -q 'nova-updates/drone-targeting-v1.5.1.js' index.html.new
          grep -q 'nova-updates/spotter-intelligence-v1.5.1.js' index.html.new
          grep -q 'nova-updates/ui-fixes-v1.5.1.js' index.html.new
          grep -q 'nova-updates/lobby-music-v1.5.1.js' index.html.new
          grep -q 'nova-updates/battlefield-v1.6.0.js' index.html.new
          grep -q 'nova-updates/disciplines-v1.7.0.js' index.html.new
          grep -q 'nova-updates/apex-disciplines-v1.7.1.js' index.html.new
          grep -q 'nova-updates/combined-arms-v1.7.2.js' index.html.new
          grep -q 'nova-updates/blast-cover-hardening-v1.7.2.js' index.html.new
          grep -q 'nova-updates/showroom-containment-v1.7.2.js' index.html.new
          grep -q 'nova-updates/showroom-fit-v1.7.3.js' index.html.new
          grep -q 'nova-updates/auto-update-test-v1.7.4.js' index.html.new
          grep -q 'nova-updates/performance-v1.7.5.js' index.html.new
          grep -q 'nova-updates/performance-v1.7.6.js' index.html.new
          grep -q 'nova-updates/lobby-history.js' index.html.new
          grep -q 'id="nova-tailwind-static"' index.html.new
          grep -Fq '.pointer-events-none' index.html.new
          grep -Fq '.font-display' index.html.new
          if grep -q 'tailwindcss-browser' index.html.new; then
            echo 'Tailwind browser runtime unexpectedly survived production materialization' >&2
            exit 1
          fi
          if grep -q 'text/tailwindcss' index.html.new; then
            echo 'Runtime Tailwind source style unexpectedly survived production materialization' >&2
            exit 1
          fi
          mv index.html.new index.html
          echo "Materialized $(wc -c < index.html) bytes into index.html with static Tailwind CSS"

      - name: Commit the plain page
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'index.html is already materialized; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Materialize NOVA TANKS runtime release'
          git push
