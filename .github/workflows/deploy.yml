name: Materialize NOVA TANKS

on:
  push:
    branches: [main]
    paths:
      - 'nova-gz/**'
      - 'nova-updates/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate runtime release files
        shell: bash
        run: |
          set -euo pipefail
          for f in nova-updates/*.js; do
            node --check "$f"
          done
          python3 -m json.tool nova-updates/releases.json >/dev/null

      - name: Rebuild tested NOVA payload and apply versioned runtime updates
        shell: bash
        run: |
          set -euo pipefail
          cat nova-gz/*.b64 | tr -d '\r\n\t ' | base64 --decode | gzip --decompress > index.html.new
          test -s index.html.new
          grep -q 'NOVA TANKS' index.html.new

          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html.new')
          html = path.read_text(encoding='utf-8')

          define_marker = "  window.__defineModule = function (id, factory) {"
          if 'window.__novaModules = modules;' not in html:
              if define_marker not in html:
                  raise SystemExit('NOVA module registry marker not found')
              exposed = (
                  "  window.__novaModules = modules;\n"
                  "  window.__novaCache = cache;\n"
                  "  window.__novaMakeRequire = makeRequire;\n\n"
              )
              html = html.replace(define_marker, exposed + define_marker, 1)

          scripts = [
              './nova-updates/sniper-v1.2.0.js',
              './nova-updates/controller-v1.3.0.js',
              './nova-updates/polish-v1.3.1.js',
              './nova-updates/stability-v1.4.0.js',
              './nova-updates/sniper-lineage-v1.4.1.js',
              './nova-updates/showroom-v1.5.0.js',
              './nova-updates/showroom-polish-v1.5.1.js',
              './nova-updates/drone-discipline-v1.5.1.js',
              './nova-updates/drone-targeting-v1.5.1.js',
              './nova-updates/spotter-intelligence-v1.5.1.js',
              './nova-updates/ui-fixes-v1.5.1.js',
              './nova-updates/lobby-music-v1.5.1.js',
              './nova-updates/lobby-history.js',
          ]
          pattern = r"window\.__bootModule\((['\"])main\1\);"
          match = re.search(pattern, html)
          if not match:
              raise SystemExit('NOVA boot marker not found')
          boot = match.group(0)
          tags = ''.join(f'<script src="{s}"></script>\n' for s in scripts if s not in html)
          if tags:
              injection = '</script>\n' + tags + '<script>\n' + boot
              html = html[:match.start()] + injection + html[match.end():]

          path.write_text(html, encoding='utf-8')
          PY

          grep -q '__novaModules' index.html.new
          grep -q 'nova-updates/sniper-v1.2.0.js' index.html.new
          grep -q 'nova-updates/controller-v1.3.0.js' index.html.new
          grep -q 'nova-updates/polish-v1.3.1.js' index.html.new
          grep -q 'nova-updates/stability-v1.4.0.js' index.html.new
          grep -q 'nova-updates/sniper-lineage-v1.4.1.js' index.html.new
          grep -q 'nova-updates/showroom-v1.5.0.js' index.html.new
          grep -q 'nova-updates/showroom-polish-v1.5.1.js' index.html.new
          grep -q 'nova-updates/drone-discipline-v1.5.1.js' index.html.new
          grep -q 'nova-updates/drone-targeting-v1.5.1.js' index.html.new
          grep -q 'nova-updates/spotter-intelligence-v1.5.1.js' index.html.new
          grep -q 'nova-updates/ui-fixes-v1.5.1.js' index.html.new
          grep -q 'nova-updates/lobby-music-v1.5.1.js' index.html.new
          grep -q 'nova-updates/lobby-history.js' index.html.new
          mv index.html.new index.html
          echo "Materialized $(wc -c < index.html) bytes into index.html"

      - name: Commit the plain page
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'index.html is already materialized; nothing to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Materialize NOVA TANKS runtime release'
          git push
