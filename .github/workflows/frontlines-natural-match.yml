name: NOVA Frontlines Natural Match Research

on:
  pull_request:
    paths:
      - 'tests/browser/frontlines-natural-match-ab.cjs'
      - 'tests/browser/frontlines-public-pilot.js'
      - 'tests/browser/frontlines-visible-defense.js'
      - 'tests/browser/frontlines-commitment-audit.js'
      - 'scripts/frontlines-natural-matrix-report.cjs'
      - 'scripts/frontlines-ab-batch.cjs'
      - 'scripts/frontlines-ab-report.cjs'
      - '.github/workflows/frontlines-natural-match.yml'
  workflow_dispatch:

# Supersede obsolete PR/feature-branch checks; never cancel a mainline
# validation or an explicit manual run. Event-scoped groups avoid push/PR
# collisions for the same head, and main uses its SHA rather than ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.event_name == 'workflow_dispatch' && github.run_id) || (github.ref == 'refs/heads/main' && github.sha) || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main') }}

jobs:
  paired-natural-match:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        layout: [0, 1, 2]
        pilot: [wander, public-bloom, public-bloom-harvest]
        seed: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm install --no-save --no-audit --no-fund --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - name: Serve actual shipping game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nova-natural-http.log 2>&1 &
          echo $! > /tmp/nova-natural-http.pid
      - name: Execute paired natural Director full-match research
        env:
          NOVA_LAYOUT_INDEX: ${{ matrix.layout }}
          NOVA_PILOT_POLICY: ${{ matrix.pilot }}
          NOVA_SEED_INDEX: ${{ matrix.seed }}
        run: node tests/browser/frontlines-natural-match-ab.cjs
      - name: Preserve research evidence even when experiment falsifies assumptions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-frontlines-natural-ab-${{ matrix.layout }}-${{ matrix.pilot }}-${{ matrix.seed }}
          path: artifacts/browser/frontlines-natural-*
          if-no-files-found: warn
          retention-days: 14


  defensive-pilot-probe:
    # Independent one-seed falsifier. Do not contaminate the established
    # 18-pair baseline or silently promote a scripted pilot to gameplay.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund --no-package-lock
      - run: npm install --no-save --no-audit --no-fund --no-package-lock playwright@1.56.1
      - run: npx playwright install chromium
      - name: Serve the actual shipping game
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/nova-defense-http.log 2>&1 &
      - name: Run defensive visible-threat Scout pilot against natural BLOOM
        env:
          NOVA_LAYOUT_INDEX: 0
          NOVA_SEED_INDEX: 0
          NOVA_PILOT_POLICY: public-bloom-harvest-defense
        run: node tests/browser/frontlines-natural-match-ab.cjs
      - name: Preserve the defensive-policy falsifier separately from baseline
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nova-frontlines-visible-defense-probe-0-0
          path: artifacts/browser/frontlines-natural-*
          if-no-files-found: warn
          retention-days: 14

  collate-natural-matrix:
    needs: paired-natural-match
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: nova-frontlines-natural-ab-*
          path: artifacts/matrix
          merge-multiple: false
      - name: Validate all attempted pairs and preserve bloom-less censored trials
        run: node scripts/frontlines-natural-matrix-report.cjs artifacts/matrix 18
      - name: Preserve audited matrix summary
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: nova-frontlines-natural-matrix-summary
          path: artifacts/matrix/frontlines-natural-matrix-summary.json
          if-no-files-found: warn
          retention-days: 14
