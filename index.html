  100% {

.anim-rise {

  border: 1px solid rgba(255, 255, 255, 0.5);
  pointer-events: none;
}

.scanlines::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  background: repeating-linear-gradient(

    rgba(120, 200, 255, 0.035) 0px,
    rgba(120, 200, 255, 0.035) 1px,

    transparent 4px

}

.safe-b {

}
