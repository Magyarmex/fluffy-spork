plugins {
    id 'com.android.application'
}

android {
    namespace 'com.novatanks.owner'
    compileSdk 35

    defaultConfig {
        applicationId 'com.novatanks.owner'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        buildConfigField 'String', 'NOVA_URL', '"https://magyarmex.github.io/fluffy-spork/"'
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
